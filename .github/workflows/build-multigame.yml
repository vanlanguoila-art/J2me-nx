
name: Build J2me-nx Multi-Game NRO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "vendor/**"
      - "java/**"
      - "data/**"
      - "config/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-multigame.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install build dependencies
        run: |
          cd tools
          npm install

      - name: Build Java class library
        run: node tools/build-classes.mjs

      - name: Build emulator runtime bundle
        run: node tools/build.mjs

      - name: Run regression tests
        run: npm test

      - name: Package NRO
        env:
          J2ME_STOCK_RUNTIME: "1"
        run: npm run nro

      - name: Verify NRO
        run: node tools/verify-nro.mjs dist/J2me-nx.nro

      - name: Upload NRO artifacts
        uses: actions/upload-artifact@v4
        with:
          name: J2me-nx-MultiGame-NRO
          path: |
            dist/J2me-nx.nro
            dist/J2me-nx-*.nro
          if-no-files-found: error
          retention-days: 14
