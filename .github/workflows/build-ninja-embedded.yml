name: Build Ninja School embedded NRO

on:
  workflow_dispatch:
  push:
    paths:
      - "data/embedded/NinjaSchoolOffline.jar"
      - "tools/patch-embedded-game.mjs"
      - ".github/workflows/build-ninja-embedded.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout J2me-nx
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install build dependencies
        run: |
          cd tools
          npm install

      - name: Apply embedded-game patch
        run: node tools/patch-embedded-game.mjs

      - name: Build Java ME classes
        run: node tools/build-classes.mjs

      - name: Build emulator bundle
        run: node tools/build.mjs

      - name: Package ROMFS and build standalone NRO
        env:
          # The npm-installed runtime is the stock runtime. Disable V8 JIT to avoid
          # the W^X/JIT startup crash described by the upstream build notes.
          J2ME_STOCK_RUNTIME: "1"
        run: |
          node tools/package.mjs
          node tools/node_modules/@nx.js/nro/dist/main.js --fat
          node tools/pack-output.mjs nro

      - name: Verify NRO
        run: node tools/verify-nro.mjs dist/J2me-nx.nro --out dist/verify.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NinjaSchool-embedded-NRO
          path: |
            dist/J2me-nx.nro
            dist/J2me-nx-*.nro
            dist/verify.txt
          if-no-files-found: error
